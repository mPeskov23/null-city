services:
  nullcity:
    build: .
    ports:
      - "${BIND:-0.0.0.0}:${PORT:-8443}:8443"
    environment:
      BIND: 0.0.0.0
      PORT: 8443
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost:8443}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      HOST_IP: ${HOST_IP:-}
      CERT_AUTODETECT: "0"       # keep the TLS certificate stable across recreations
      DATABASE_PATH: /app/data/nullcity.sqlite3
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      BACKUP_RETAIN: ${BACKUP_RETAIN:-7}
      # Email 2FA. SMTP_USER/SMTP_PASSWORD left empty = login generated by smtp-init
      # and read by deploy/entrypoint.sh from /run/smtp (see docs/SMTP-2FA.md).
      SMTP_HOST: ${SMTP_HOST:-smtp}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Null City <no-reply@nullcity.local>}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      SMTP_CA: ${SMTP_CA:-/run/smtp/ca.pem}
    volumes:
      - city-data:/app/data
      # PUBLIC CA cert + SMTP login only (read-only). Never the TLS private key.
      - smtp-shared:/run/smtp:ro
    depends_on:
      # Hard dependency: the one-shot job must have produced the CA/login.
      smtp-init:
        condition: service_completed_successfully
      # Soft dependency: wait for a healthy mail server at boot, but never block or
      # stop the game if it is down (required: false). Later outages are not
      # propagated: depends_on is only evaluated at start-up.
      smtp:
        condition: service_healthy
        required: false
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://localhost:8443/api/health',context=ssl.create_default_context(cafile='/app/data/tls/cert.pem'),timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # One-shot job: creates the private CA, the server cert (SAN smtp) and the SMTP
  # login. Reuses the nullcity image (has openssl): no extra image to pull.
  smtp-init:
    build: .
    entrypoint: ["/bin/sh", "/app/deploy/smtp-init.sh"]
    user: "0:0"                  # must chown files to two different uids
    environment:
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - smtp-pki:/pki
      - smtp-shared:/shared
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp                     # CA private key lives here only, then vanishes
    cap_drop:
      - ALL
    cap_add:
      - CHOWN                    # the only capability needed
    security_opt:
      - no-new-privileges:true

  # Mailpit: SMTP server + web inbox in one container. No port 1025 on the host.
  smtp:
    image: axllent/mailpit:v1.34.0
    user: "10002:10002"
    depends_on:
      smtp-init:
        condition: service_completed_successfully
    ports:
      # OTPs are readable in this UI: loopback only, HTTPS.
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025          # reachable on the compose network only
      MP_UI_BIND_ADDR: 0.0.0.0:8025
      MP_SMTP_TLS_CERT: /pki/cert.pem
      MP_SMTP_TLS_KEY: /pki/key.pem
      MP_SMTP_REQUIRE_STARTTLS: "true"         # refuse plaintext sessions
      MP_SMTP_AUTH_FILE: /pki/auth.txt         # login required (secret generated at init)
      MP_ALLOWED_HOSTS: localhost:${MAIL_UI_PORT:-8025},127.0.0.1:${MAIL_UI_PORT:-8025}   # anti DNS-rebinding
      MP_UI_TLS_CERT: /pki/cert.pem
      MP_UI_TLS_KEY: /pki/key.pem
      MP_MAX_MESSAGES: 500
      MP_MAX_AGE: 1d                           # OTPs do not linger
      MP_DISABLE_VERSION_CHECK: "true"         # no phone-home: works offline
      MP_SMTP_DISABLE_RDNS: "true"
      # Optional real delivery (relay). All empty = pure capture mode.
      MP_SMTP_RELAY_HOST: ${MP_SMTP_RELAY_HOST:-}
      MP_SMTP_RELAY_PORT: ${MP_SMTP_RELAY_PORT:-}
      MP_SMTP_RELAY_STARTTLS: ${MP_SMTP_RELAY_STARTTLS:-}
      MP_SMTP_RELAY_TLS: ${MP_SMTP_RELAY_TLS:-}
      MP_SMTP_RELAY_AUTH: ${MP_SMTP_RELAY_AUTH:-}
      MP_SMTP_RELAY_USERNAME: ${MP_SMTP_RELAY_USERNAME:-}
      MP_SMTP_RELAY_PASSWORD: ${MP_SMTP_RELAY_PASSWORD:-}
      MP_SMTP_RELAY_OVERRIDE_FROM: ${MP_SMTP_RELAY_OVERRIDE_FROM:-}
      MP_SMTP_RELAY_RETURN_PATH: ${MP_SMTP_RELAY_RETURN_PATH:-}
      MP_SMTP_RELAY_ALL: ${MP_SMTP_RELAY_ALL:-}
    volumes:
      - smtp-pki:/pki:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m           # Mailpit's temporary mailbox DB: RAM only, lost on stop
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/mailpit", "readyz", "--https", "--listen", "127.0.0.1:8025"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  city-data:
  smtp-pki:                      # server key + cert + auth file (Mailpit only)
  smtp-shared:                   # public CA + SMTP login (nullcity, read-only)
